name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to operate on"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      operation:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  # ============================================================
  # DETECT
  # ============================================================

  detect:
    name: Detect Terraform changes
    runs-on: ubuntu-latest

    outputs:
      dev: ${{ steps.paths.outputs.dev }}
      staging: ${{ steps.paths.outputs.staging }}
      production: ${{ steps.paths.outputs.production }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Determine affected environments
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          # ----------------------------------------------------
          # Manual workflow
          # ----------------------------------------------------

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              dev)
                echo "dev=true" >> "$GITHUB_OUTPUT"
                echo "staging=false" >> "$GITHUB_OUTPUT"
                echo "production=false" >> "$GITHUB_OUTPUT"
                ;;

              staging)
                echo "dev=false" >> "$GITHUB_OUTPUT"
                echo "staging=true" >> "$GITHUB_OUTPUT"
                echo "production=false" >> "$GITHUB_OUTPUT"
                ;;

              production)
                echo "dev=false" >> "$GITHUB_OUTPUT"
                echo "staging=false" >> "$GITHUB_OUTPUT"
                echo "production=true" >> "$GITHUB_OUTPUT"
                ;;

              *)
                echo "Invalid environment: ${{ inputs.environment }}"
                exit 1
                ;;
            esac

            exit 0
          fi

          # ----------------------------------------------------
          # Pull request
          # ----------------------------------------------------

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
            echo "staging=true" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ----------------------------------------------------
          # Push to main
          # ----------------------------------------------------

          if git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" 2>/dev/null \
              | grep -q '^terraform/'; then

            echo "dev=true" >> "$GITHUB_OUTPUT"
            echo "staging=true" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"

          else

            echo "dev=false" >> "$GITHUB_OUTPUT"
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # VALIDATE
  # ============================================================

  validate:
    name: Terraform Format & Validate
    needs: detect

    if: |
      github.event_name == 'pull_request' ||
      needs.detect.outputs.dev == 'true' ||
      needs.detect.outputs.staging == 'true' ||
      needs.detect.outputs.production == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"

      # --------------------------------------------------------
      # FORMAT
      # --------------------------------------------------------

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      # --------------------------------------------------------
      # VALIDATE
      # --------------------------------------------------------

      - name: Validate Terraform modules and environments
        shell: bash
        run: |
          set -euo pipefail

          find terraform -type f -name '*.tf' -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"

            echo "=========================================="
            echo "Validating: $dir"
            echo "=========================================="

            terraform -chdir="$dir" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="$dir" validate \
              -no-color
          done


  # ============================================================
  # PLAN
  # ============================================================

  plan:
    name: Terraform Plan
    needs:
      - detect
      - validate

    if: |
      github.event_name == 'pull_request' ||
      needs.detect.outputs.dev == 'true' ||
      needs.detect.outputs.staging == 'true' ||
      needs.detect.outputs.production == 'true'

    strategy:
      fail-fast: false

      matrix:
        include:
          - environment: dev
            run: ${{ needs.detect.outputs.dev }}

          - environment: staging
            run: ${{ needs.detect.outputs.staging }}

          - environment: production
            run: ${{ needs.detect.outputs.production }}

    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    steps:

      - name: Skip unaffected environment
        if: |
          matrix.run != 'true' &&
          github.event_name != 'pull_request'
        run: echo "Environment not affected."

      - name: Checkout
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        uses: actions/checkout@v6.0.2

      - name: Check AWS role secret
        run: |
          if [ -z "${{ vars.TERRAFORM_PLAN_ROLE_ARN }}" ]; then
            echo "TERRAFORM_PLAN_ROLE_ARN variable is missing"
            exit 1
          fi

          echo "AWS role variable is present"

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "repository_id",
              "repository_owner_id",
              "environment",
              "event_name",
              "ref"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY
          

      - name: Configure AWS credentials
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # role-session-name: terraform-plan-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"

      # --------------------------------------------------------
      # INIT
      # --------------------------------------------------------

      - name: Terraform init
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ matrix.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      # --------------------------------------------------------
      # FORMAT
      # --------------------------------------------------------

      - name: Terraform format check
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        run: |
          terraform fmt \
            -check \
            -recursive \
            terraform/environments/${{ matrix.environment }}

      # --------------------------------------------------------
      # VALIDATE
      # --------------------------------------------------------

      - name: Terraform validate
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform validate -no-color

      # --------------------------------------------------------
      # DETERMINE OPERATION
      # --------------------------------------------------------

      - name: Determine Terraform operation
        id: operation
        if: |
          matrix.run == 'true' ||
          github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "operation=plan" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "operation=${{ inputs.operation }}" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "operation=apply" >> "$GITHUB_OUTPUT"

          else
            echo "Unsupported event"
            exit 1
          fi

      # --------------------------------------------------------
      # PLAN
      # --------------------------------------------------------

      - name: Terraform plan
        if: |
          (matrix.run == 'true' || github.event_name == 'pull_request') &&
          steps.operation.outputs.operation != 'destroy'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      # --------------------------------------------------------
      # DESTROY PLAN
      # --------------------------------------------------------

      - name: Terraform destroy plan
        if: |
          (matrix.run == 'true' || github.event_name == 'pull_request') &&
          steps.operation.outputs.operation == 'destroy'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -out=tfplan

      # --------------------------------------------------------
      # UPLOAD PLAN
      # --------------------------------------------------------

      - name: Upload Terraform plan
        if: |
          (matrix.run == 'true' || github.event_name == 'pull_request') &&
          steps.operation.outputs.operation != 'destroy'
        uses: actions/upload-artifact@v5
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 7

      - name: Upload Terraform destroy plan
        if: |
          (matrix.run == 'true' || github.event_name == 'pull_request') &&
          steps.operation.outputs.operation == 'destroy'
        uses: actions/upload-artifact@v5
        with:
          name: terraform-destroy-plan-${{ matrix.environment }}-${{ github.run_id }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 7


  # ============================================================
  # APPLY
  # ============================================================

  apply:
    name: Terraform Apply
    needs:
      - detect
      - validate
      - plan

    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.operation == 'apply'
      )

    strategy:
      fail-fast: false

      matrix:
        include:
          - environment: dev
            run: ${{ needs.detect.outputs.dev }}

          - environment: staging
            run: ${{ needs.detect.outputs.staging }}

          - environment: production
            run: ${{ needs.detect.outputs.production }}

    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    steps:

      - name: Skip unaffected environment
        if: matrix.run != 'true'
        run: echo "Environment not affected."

      - name: Checkout
        if: matrix.run == 'true'
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        if: matrix.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        if: matrix.run == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"

      # --------------------------------------------------------
      # INIT
      # --------------------------------------------------------

      - name: Terraform init
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ matrix.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      # --------------------------------------------------------
      # DOWNLOAD EXACT PLAN
      # --------------------------------------------------------

      - name: Download Terraform plan
        if: matrix.run == 'true'
        uses: actions/download-artifact@v6
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.environment }}

      # --------------------------------------------------------
      # APPLY
      # --------------------------------------------------------

      - name: Terraform apply
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan


  # ============================================================
  # DESTROY
  # ============================================================

  destroy:
    name: Terraform Destroy
    needs:
      - detect
      - validate
      - plan

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'destroy'

    strategy:
      fail-fast: false

      matrix:
        include:
          - environment: dev
            run: ${{ needs.detect.outputs.dev }}

          - environment: staging
            run: ${{ needs.detect.outputs.staging }}

          - environment: production
            run: ${{ needs.detect.outputs.production }}

    runs-on: ubuntu-latest

    # IMPORTANT:
    # Configure GitHub environment protection rules for
    # staging and production.
    environment: ${{ matrix.environment }}

    steps:

      - name: Skip unaffected environment
        if: matrix.run != 'true'
        run: echo "Environment not selected."

      - name: Checkout
        if: matrix.run == 'true'
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        if: matrix.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Setup Terraform
        if: matrix.run == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.6"

      # --------------------------------------------------------
      # INIT
      # --------------------------------------------------------

      - name: Terraform init
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=observastack/${{ matrix.environment }}/terraform.tfstate" \
            -input=false \
            -no-color

      # --------------------------------------------------------
      # DOWNLOAD DESTROY PLAN
      # --------------------------------------------------------

      - name: Download Terraform destroy plan
        if: matrix.run == 'true'
        uses: actions/download-artifact@v6
        with:
          name: terraform-destroy-plan-${{ matrix.environment }}-${{ github.run_id }}
          path: terraform/environments/${{ matrix.environment }}

      # --------------------------------------------------------
      # DESTROY
      # --------------------------------------------------------

      - name: Terraform destroy
        if: matrix.run == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan